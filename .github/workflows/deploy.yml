name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 매월 1일 09:00(KST)에 다시 배포해 이력서의 총 경력 개월 수를 갱신한다
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # PDF는 미리보기 서버(4173)에 띄운 페이지를 찍어 만들고, 끝나면 dist를 다시 빌드한다
      - name: Build and export PDFs
        run: |
          node --import tsx scripts/serve.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run pdf
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
