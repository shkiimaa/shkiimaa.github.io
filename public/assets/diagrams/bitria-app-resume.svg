<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" fill="none" role="img" aria-labelledby="app-resume-title app-resume-desc"><title id="app-resume-title">앱 복귀 시 데이터·연결 복구</title><desc id="app-resume-desc">Capacitor 앱 복귀 이벤트가 쿼리 focus 상태와 시세·알림 소켓 복구를 함께 처리합니다. 현재 상태는 API로 재조회하고 이후 실시간 변경은 소켓으로 수신합니다.</desc><defs><marker id="app-resume-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#68717d"/></marker></defs><rect x="255" y="12" width="250" height="62" rx="3" fill="#f5f7fb" stroke="#b8c4d6"/><text x="380.0" y="37.5" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" fill="#20242b">앱 포그라운드 복귀</text><text x="380.0" y="58.5" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" fill="#20242b">Capacitor appStateChange</text><rect x="20" y="124" width="230" height="66" rx="3" fill="#f5f7fb" stroke="#b8c4d6"/><text x="135.0" y="151.5" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" fill="#20242b">TanStack Query</text><text x="135.0" y="172.5" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" fill="#20242b">focusManager.setFocused(true)</text><rect x="275" y="124" width="210" height="66" rx="3" fill="#f5f7fb" stroke="#b8c4d6"/><text x="380.0" y="151.5" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" fill="#20242b">시세 소켓</text><text x="380.0" y="172.5" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" fill="#20242b">handleForeground()</text><rect x="510" y="124" width="230" height="66" rx="3" fill="#f5f7fb" stroke="#b8c4d6"/><text x="625.0" y="151.5" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" fill="#20242b">체결·잔고 알림 소켓</text><text x="625.0" y="172.5" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" fill="#20242b">handleForeground()</text><path d="M380 74V99H135V124" stroke="#8795aa" stroke-width="1.5" marker-end="url(#app-resume-arrow)"/><path d="M380 99V124" stroke="#8795aa" stroke-width="1.5" marker-end="url(#app-resume-arrow)"/><path d="M380 99H625V124" stroke="#8795aa" stroke-width="1.5" marker-end="url(#app-resume-arrow)"/><rect x="20" y="239" width="230" height="66" rx="3" fill="#f5f7fb" stroke="#b8c4d6"/><text x="135.0" y="266.5" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" fill="#20242b">사용 중인 stale 쿼리 재조회</text><text x="135.0" y="287.5" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" fill="#20242b">포지션 · 자산 · 주문</text><rect x="275" y="239" width="210" height="66" rx="3" fill="#f5f7fb" stroke="#b8c4d6"/><text x="380.0" y="277.0" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" fill="#20242b">실시간 시세 수신 복구</text><rect x="510" y="239" width="230" height="66" rx="3" fill="#f5f7fb" stroke="#b8c4d6"/><text x="625.0" y="266.5" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" fill="#20242b">끊긴 연결 재연결</text><text x="625.0" y="287.5" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" fill="#20242b">체결 · 잔고 변경 수신 복구</text><path d="M135 190V239" stroke="#8795aa" stroke-width="1.5" marker-end="url(#app-resume-arrow)"/><path d="M380 190V239" stroke="#8795aa" stroke-width="1.5" marker-end="url(#app-resume-arrow)"/><path d="M625 190V239" stroke="#8795aa" stroke-width="1.5" marker-end="url(#app-resume-arrow)"/><text x="380" y="343" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="13" fill="#68717d">API: 현재 상태 확인　 /　 소켓: 이후 변경 수신</text></svg>